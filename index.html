<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Xyzoocraft Minecraft Server</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #1e1e2f, #2d2d44);
            color: #ffffff;
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            text-align: center;
        }
        .container {
            background: rgba(255, 255, 255, 0.05);
            padding: 40px;
            border-radius: 16px;
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
            backdrop-filter: blur(8px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            max-width: 450px;
            width: 90%;
        }
        h1 {
            font-size: 2.5rem;
            margin-bottom: 20px;
            background: linear-gradient(45deg, #ff7b00, #ffae00);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        p {
            font-size: 1.1rem;
            color: #ccc;
            line-height: 1.6;
            margin: 10px 0;
        }
        /* Style baru untuk kotak info server */
        .server-info {
            background: rgba(0, 0, 0, 0.3);
            border-left: 4px solid #ff7b00;
            padding: 15px;
            border-radius: 8px;
            margin: 20px 0;
            text-align: left; /* Teks rata kiri di dalam kotak agar rapi */
        }
        .server-info text {
            display: block;
            margin-bottom: 5px;
        }
        .highlight {
            color: #ffae00;
            font-weight: bold;
            font-family: 'Courier New', Courier, monospace; /* Font ala coding agar mudah dibaca */
        }
        .btn {
            display: inline-block;
            margin-top: 15px;
            padding: 12px 24px;
            background: linear-gradient(45deg, #ff7b00, #ffae00);
            color: #fff;
            text-decoration: none;
            border-radius: 8px;
            font-weight: bold;
            transition: transform 0.2s, box-shadow 0.2s;
            cursor: pointer;
            border: none;
            width: 100%;
            box-sizing: border-box;
        }
        .btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 5px 15px rgba(255, 123, 0, 0.4);
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>Xyzoocraft 🚀</h1>
        
        <p>Selamat datang di Server Minecraft Xyzoo. Mau join?</p>
        <p>Langsung saja masukkan IP di bawah ini:</p>
        <p> Server Anddres: xyzoocraft.my.id<p>
            <p> Port : 12345<p>
        
        <!-- Kotak Info Server yang sudah dirapikan -->
        <div class="server-info">
            <p><strong>Server Address:</strong> <span class="highlight">xyzoocraft.my.id</span></p>
            <p><strong>Port:</strong> <span class="highlight">12345</span></p>
        </div>
        
        <button class="btn" onclick="salinIP()">Salin IP Server</button>
    </div>

    <script>
        // Fungsi keren untuk otomatis menyalin IP saat tombol diklik
        function salinIP() {
            navigator.clipboard.writeText("xyzoocraft.my.id");
            alert("IP Server berhasil disalin! Tinggal paste di Minecraft kamu. 🎮");
        }
    </script>

</body>
</html>
